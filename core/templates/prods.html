{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
<center>
    <h1>Lista de Produtos</h1>
     <table>
        <thead>
        <tr>
            <th>Produto</th>
            <th></th>
            <th>Valor</th>
            <th></th>
            <th>Quantidade</th>
        </tr>
        </thead>
        <tbody>
            {% for produto in produtos %}
                <tr>
                <td><a href="{% url 'produto' produto.id%}">{{ produto.nome }}</a></td>
                <td></td>
                <td>{{ produto.preco }}</td>
                <td></td>
                <td>{{ produto.estoque }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/index"><button type="button">Voltar</button></a>
    </center>
</body>

</html>
